[project]
name = "bhe"
version = "0.1.0"
description = "Ergonomic, read-only CLI for the BloodHound Enterprise API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grayson Hill" }]
keywords = ["bloodhound", "bloodhound-enterprise", "active-directory", "cli", "security"]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "keyring>=25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
bhe = "bhe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bhe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
